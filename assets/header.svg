<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="Canberk Varli. I build AI products end to end.">
  <defs>
    <clipPath id="card"><rect width="880" height="260" rx="14"/></clipPath>
  </defs>
  <style>
    .mark { font: 500 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #ededed; }
    .mark .soft { fill: #8a8a8a; }
    .h { font: 600 52px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif; letter-spacing: -1.5px; fill: #f5f5f5; }
    .h1 { animation: rise .8s cubic-bezier(.2,.8,.2,1) .1s backwards; }
    .h2 { fill: #f3b27a; animation: rise .8s cubic-bezier(.2,.8,.2,1) .6s backwards; }
    .sub { font: 400 16px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif; fill: #c4c4c4; animation: fade .8s ease 1.1s backwards; }
    .dot { fill: #22c55e; animation: pulse 2.4s ease-in-out infinite; }
    .ring { fill: none; stroke: #22c55e; stroke-width: 1.5; transform-origin: 45px 216px; animation: ping 2.4s ease-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .h1, .h2, .sub, .dot, .ring { animation: none; } .ring { display: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="880" height="260" fill="#0b0b0b"/>
    <text class="mark" x="40" y="52">canberk<tspan class="soft">[.]</tspan>varli</text>
    <text class="h h1" x="38" y="128">I build AI products</text>
    <text class="h h2" x="38" y="188">end to end.</text>
    <circle class="ring" cx="45" cy="216" r="4"/>
    <circle class="dot" cx="45" cy="216" r="4"/>
    <text class="sub" x="58" y="221">Engineer and working actor · building Ghost Light · Berkeley, CA</text>
  </g>
</svg>
