<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Ghost Light. Find your next audition piece. iOS and web.">
  <defs>
    <radialGradient id="spot" cx="110" cy="70" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3821d" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#f3821d" stop-opacity=".1"/>
      <stop offset="1" stop-color="#f3821d" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="card"><rect width="880" height="200" rx="14"/></clipPath>
  </defs>
  <style>
    .name { font: 700 40px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif; letter-spacing: -1px; fill: #fbf5ec; }
    .tag { font: 400 19px -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif; fill: #f3b27a; }
    .meta { font: 500 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #d9cfc3; letter-spacing: .4px; }
    .chip { fill: none; stroke: #5a4636; }
  </style>
  <g clip-path="url(#card)">
    <rect width="880" height="200" fill="#0e0b09"/>
    <rect width="880" height="200" fill="url(#spot)"/>
    <g transform="translate(110 0)">
      <circle cx="0" cy="70" r="22" fill="#ffd08c" opacity=".85" filter="url(#bloom)"/>
      <path d="M0 42 C16 42 28 54 28 69 C28 80 22 87 17 93 C14 96 13 99 13 101 L-13 101 C-13 99 -14 96 -17 93 C-22 87 -28 80 -28 69 C-28 54 -16 42 0 42 Z" fill="#f3821d"/>
      <path d="M-7 101 L-7 72 M7 101 L7 72" stroke="#7a2e05" stroke-width="2" fill="none"/>
      <path d="M-13 72 L-7 66 L0 72 L7 66 L13 72" stroke="#7a2e05" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="-16" y="104" width="32" height="6" rx="3" fill="#cb4b00"/>
      <rect x="-14" y="112" width="28" height="6" rx="3" fill="#cb4b00"/>
      <rect x="-3.5" y="118" width="7" height="50" fill="#8a3304"/>
      <rect x="-22" y="166" width="44" height="7" rx="3.5" fill="#8a3304"/>
    </g>
    <text class="name" x="210" y="82">Ghost Light</text>
    <text class="tag" x="212" y="116">Find your next audition piece. Then rehearse it.</text>
    <rect class="chip" x="212" y="140" width="100" height="28"/>
    <text class="meta" x="226" y="159">iOS · web</text>
    <rect class="chip" x="322" y="140" width="148" height="28"/>
    <text class="meta" x="336" y="159">19k+ monologues</text>
    <rect class="chip" x="480" y="140" width="182" height="28"/>
    <text class="meta" x="494" y="159">voice scene partner</text>
  </g>
</svg>
